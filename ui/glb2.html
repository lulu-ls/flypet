<!doctype html>
<html><head><meta charset="UTF-8"><title>t</title>
<style>html,body{margin:0;height:100%;background:#222;overflow:hidden}#b{position:fixed;bottom:2px;left:2px;font:11px monospace;color:#8ff;background:#000a;z-index:9}</style>
</head><body><div id="b">boot</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';
const b=document.getElementById('b'); const dbg=s=>{b.textContent=s;document.title=s};
dbg('js');
const r=new THREE.WebGLRenderer({antialias:true});
document.body.appendChild(r.domElement);
r.setSize(innerWidth,innerHeight); r.setClearColor(0x222222,1);
const s=new THREE.Scene(); const c=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.001,1000);
s.add(new THREE.HemisphereLight(0xffffff,0x444444,3));
dbg('webgl');
const L=new GLTFLoader();
L.load('models/butterfly.glb',
  g=>{ dbg('LOADED anim='+g.animations.length+' scenes='+s.children.length);
       s.add(g.scene);
       const box=new THREE.Box3().setFromObject(g.scene); const sz=new THREE.Vector3(); box.getSize(sz);
       const k=1.5/Math.max(sz.x,sz.y,sz.z); g.scene.scale.setScalar(k);
       const cnt=new THREE.Vector3(); box.getCenter(cnt); g.scene.position.sub(cnt);
       c.position.set(0,.6,2.2); c.lookAt(0,0,0);
       dbg('ADDED size='+sz.x.toFixed(2)+','+sz.y.toFixed(2)+','+sz.z.toFixed(2));
       let m=null,cl=new THREE.Clock();
       if(g.animations.length){m=new THREE.AnimationMixer(g.scene);m.clipAction(g.animations[0]).play();}
       (function a(){requestAnimationFrame(a);g.scene.rotation.y+=.005;if(m)m.update(cl.getDelta());r.render(s,c);})();
     },
  p=>dbg('prog '+p.loaded+'/'+p.total),
  e=>dbg('FAIL '+e.message));
</script>
</body></html>
