<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>stage2-glb</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #222; }
  #app { width: 100%; height: 100%; }
  #boot { position: fixed; bottom: 4px; left: 4px; font: 11px monospace; color: #8ff; background: #000a; z-index: 99; }
</style>
</head>
<body>
<div id="app"></div>
<div id="boot">boot</div>
<script type="module">
import * as THREE from './vendor/three.module.js';
import { GLTFLoader } from './vendor/GLTFLoader.js';

const boot = document.getElementById('boot');
const dbg = (s) => { boot.textContent = s; document.title = s; };
dbg('s2-js');

try {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.001, 1000);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x222222, 1);
  document.getElementById('app').appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 3));
  const key = new THREE.DirectionalLight(0xffffff, 2); key.position.set(-2, 4, 2);
  scene.add(key);
  dbg('s2-webgl');

  const loader = new GLTFLoader();
  loader.load('models/butterfly.glb',
    (gltf) => {
      dbg('s2-load ' + gltf.animations.length + ' clips');
      scene.add(gltf.scene);

      // 自动居中 + 缩放
      const box = new THREE.Box3().setFromObject(gltf.scene);
      const center = new THREE.Vector3();
      const size = new THREE.Vector3();
      box.getCenter(center);
      box.getSize(size);
      gltf.scene.position.sub(center);
      const maxSize = Math.max(size.x, size.y, size.z);
      const k = 1.5 / maxSize;
      gltf.scene.scale.setScalar(k);
      dbg('s2-box ' + size.x.toFixed(2) + 'x' + size.y.toFixed(2) + 'x' + size.z.toFixed(2) + ' k=' + k.toFixed(3));

      camera.position.set(0, 0.6, 2.2);
      camera.lookAt(0, 0, 0);
      dbg('s2-anim');

      // 播放第一个动画（待机煽翅）
      let mixer = null, clock = null;
      if (gltf.animations.length) {
        mixer = new THREE.AnimationMixer(gltf.scene);
        mixer.clipAction(gltf.animations[0]).play();
        clock = new THREE.Clock();
      }
      function animate() {
        requestAnimationFrame(animate);
        gltf.scene.rotation.y += 0.005;
        if (mixer) mixer.update(clock.getDelta());
        renderer.render(scene, camera);
      }
      animate();
    },
    (p) => { dbg('s2-prog ' + p.loaded + '/' + p.total); },
    (e) => { dbg('s2-fail ' + e.message); }
  );
} catch (e) {
  dbg('s2-err ' + e.message);
}
</script>
</body>
</html>
