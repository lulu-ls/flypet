<!doctype html>
<html>
<head>
<meta charset="UTF-8">
<title>stage1-cube</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #222; }
  #app { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import * as THREE from './vendor/three.module.js';

// 阶段标记：写入 title，供外部确认 JS 执行到哪一步
document.title = 's1-js';
try {
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
  camera.position.z = 5;
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  document.title = 's1-webgl';
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.getElementById('app').appendChild(renderer.domElement);

  const geometry = new THREE.BoxGeometry();
  const material = new THREE.MeshNormalMaterial();
  const cube = new THREE.Mesh(geometry, material);
  scene.add(cube);
  document.title = 's1-render';

  function animate() {
    requestAnimationFrame(animate);
    cube.rotation.x += 0.01;
    cube.rotation.y += 0.01;
    renderer.render(scene, camera);
  }
  animate();
} catch (e) {
  document.title = 's1-err ' + e.message;
}
</script>
</body>
</html>
