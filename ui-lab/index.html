<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>FlyPet 视觉实验室 · 程序化生成</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px;
    background: #14161a; color: #d8dde4;
    font: 13px/1.5 -apple-system, "PingFang SC", sans-serif;
  }
  h1 { font-size: 16px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: #7d8794; font-size: 12px; margin-bottom: 18px; }
  .stage { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
  .viewer {
    background: linear-gradient(145deg, #2b3038, #1b1e23);
    border: 1px solid #333944; border-radius: 14px;
    width: 420px; height: 420px; display: flex; align-items: center; justify-content: center;
  }
  .panel { min-width: 230px; }
  .row { margin-bottom: 14px; }
  label { display: block; font-size: 11px; color: #8b95a3; margin-bottom: 5px; letter-spacing: .3px; }
  select, input[type=range] { width: 100%; }
  select {
    background: #22262d; color: #d8dde4; border: 1px solid #3a4150;
    padding: 7px 9px; border-radius: 7px; font-size: 13px;
  }
  button {
    background: #3d6fd8; color: #fff; border: 0; padding: 9px 15px;
    border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 500; width: 100%;
  }
  button:hover { background: #4a7fe8; }
  button.ghost { background: #2a2f38; border: 1px solid #3a4150; margin-top: 8px; }
  .chips { display: flex; gap: 6px; margin-bottom: 14px; }
  .chip {
    flex: 1; text-align: center; padding: 7px 0; border-radius: 7px; cursor: pointer;
    background: #22262d; border: 1px solid #333944; font-size: 12px; color: #98a2b0;
  }
  .chip.on { background: #3d6fd8; color: #fff; border-color: #3d6fd8; }
  .grid { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
  .cell {
    background: #1b1e23; border: 1px solid #2c313a; border-radius: 10px;
    width: 108px; height: 108px; cursor: pointer; position: relative;
  }
  .cell:hover { border-color: #3d6fd8; }
  .cell canvas { display: block; border-radius: 10px; }
  .cell b {
    position: absolute; left: 6px; bottom: 4px; font-size: 9px;
    color: #6d7683; font-weight: 500; letter-spacing: .3px;
  }
  .cell b.has { color: #c6cdd6; }
  .hint { color: #6d7683; font-size: 11px; margin-top: 14px; line-height: 1.7; }

  /* ---- 词条 ---- */
  .sec { margin-top: 16px; border-top: 1px solid #2c313a; padding-top: 13px; }
  .sec h3 {
    margin: 0 0 9px; font-size: 11px; font-weight: 600;
    color: #8b95a3; letter-spacing: .5px;
  }
  .traits { display: flex; flex-direction: column; gap: 6px; }
  .trait {
    display: flex; align-items: center; gap: 8px;
    background: #1b1e23; border: 1px solid #2c313a;
    border-left-width: 3px; border-radius: 6px; padding: 6px 9px;
  }
  .trait .tn { font-size: 12px; font-weight: 600; letter-spacing: .3px; }
  .trait .td { font-size: 10px; color: #79838f; margin-left: auto; text-align: right; }
  .trait .rk { font-size: 9px; color: #6d7683; letter-spacing: .5px; }
  .r-common    { border-left-color: #7d8794; } .r-common .tn    { color: #a8b2bf; }
  .r-rare      { border-left-color: #3d7fd8; } .r-rare .tn      { color: #6ba5f0; }
  .r-epic      { border-left-color: #9a5fd8; } .r-epic .tn      { color: #b984ec; }
  .r-legendary { border-left-color: #e8a33d; } .r-legendary .tn { color: #f5c065; }
  .r-legendary { background: linear-gradient(90deg, #2a2318, #1b1e23 60%); }

  .stats { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; font-size: 11px; }
  .stats .k { color: #79838f; }
  .stats .v { color: #c6cdd6; font-variant-numeric: tabular-nums; }
  .stats .v.up { color: #6dd18a; }
  .stats .v.dn { color: #e07a7a; }

  /* ---- 词条选择器 ---- */
  .tpick { display: flex; flex-wrap: wrap; gap: 5px; }
  .tp {
    padding: 4px 9px; border-radius: 12px; font-size: 11px; cursor: pointer;
    background: #22262d; border: 1px solid #333944; color: #98a2b0;
    user-select: none; transition: all .12s;
  }
  .tp:hover { border-color: #5a6270; color: #c6cdd6; }
  .tp.on { color: #fff; font-weight: 600; }
  .tp.on.r-common    { background: #3a4150; border-color: #7d8794; }
  .tp.on.r-rare      { background: #1f3a5f; border-color: #3d7fd8; }
  .tp.on.r-epic      { background: #3a2350; border-color: #9a5fd8; }
  .tp.on.r-legendary { background: #4a3a18; border-color: #e8a33d; }
  button.small { padding: 6px 10px; font-size: 11px; margin-top: 9px; }

  /* 分组标题 & 预设 */
  .tgrp { font-size: 10px; color: #6d7683; letter-spacing: .6px; margin: 10px 0 6px; }
  .presets { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
  .pre {
    padding: 3px 8px; border-radius: 5px; font-size: 10px; cursor: pointer;
    background: #22262d; border: 1px solid #333944; color: #8b95a3; user-select: none;
  }
  .pre:hover { border-color: #5a6270; color: #d8dde4; }
</style>
</head>
<body>
  <h1>程序化飞虫生成</h1>
  <div class="sub">同一物种模板下，种子决定个体外观 · 进化阶段沿基因衍生</div>

  <div class="stage">
    <div class="viewer"><canvas id="main"></canvas></div>
    <div class="panel">
      <div class="row">
        <label>物种模板（约束参数范围）</label>
        <select id="species">
          <option value="butterfly">蝴蝶 · 大翅 / 眼斑</option>
          <option value="dragonfly">蜻蜓 · 瘦长 / 细翅</option>
          <option value="fly">苍蝇 · 瘦长 / 宽翅</option>
          <option value="spider">蜘蛛 · 爬行 / 长腿</option>
        </select>
      </div>
      <div class="row">
        <label>进化阶段</label>
        <div class="chips" id="stages">
          <div class="chip" data-s="1">卵</div>
          <div class="chip" data-s="2">幼虫</div>
          <div class="chip on" data-s="3">成虫</div>
          <div class="chip" data-s="4">华彩</div>
        </div>
      </div>
      <div class="row">
        <label>形态参数微调</label>
        <input type="range" id="wingLen" min="60" max="150" value="100">
        <input type="range" id="bodyW" min="60" max="150" value="100" style="margin-top:6px">
        <input type="range" id="hue" min="0" max="359" value="0" style="margin-top:6px">
      </div>
      <button id="rand">随机生成新个体</button>
      <button class="ghost" id="anim">播放 / 暂停</button>

      <div class="sec">
        <h3>词条 TRAITS（当前个体）</h3>
        <div class="traits" id="traits"></div>
      </div>

      <div class="sec">
        <h3>词条选择器（点击启用 / 移除）</h3>
        <div class="presets">
          <span class="pre" data-p="legend">满配传说</span>
          <span class="pre" data-p="look">全外观</span>
          <span class="pre" data-p="stat">全属性</span>
          <span class="pre" data-p="roll">随机 3 条</span>
          <span class="pre" data-p="none">清空</span>
        </div>
        <div class="tgrp">外观类 LOOK（纯视觉）</div>
        <div class="tpick" id="tpickLook"></div>
        <div class="tgrp">属性类 STAT（影响数值）</div>
        <div class="tpick" id="tpickStat"></div>
        <button class="ghost small" id="tclean">清除自选，回到种子随机</button>
      </div>

      <div class="sec">
        <h3>属性（受词条影响）</h3>
        <div class="stats" id="stats"></div>
      </div>

      <div class="hint">
        同种子 → 同外观同词条（可复现）<br>
        进化时有机会觉醒新词条
      </div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

<script src="../ui/render.js"></script>
<script>
/* ======================= 5. 交互 ======================= */
const W = 380, H = 380, DPR = Math.min(2, window.devicePixelRatio || 1);
const main = document.getElementById('main');
main.width = W * DPR; main.height = H * DPR;
main.style.width = W + 'px'; main.style.height = H + 'px';
const ctx = main.getContext('2d');
ctx.scale(DPR, DPR);

let seed = Math.floor(Math.random() * 1e6);
let species = 'butterfly';
let stage = 3;
let playing = true;
let t0 = performance.now();

function currentGenome() {
  const g = evolve(makeGenome(seed, species, stage), stage);
  if (manualTraits) {
    g.traits = [...manualTraits];            // 手动模式：所见即所得
  } else if ((g.traits || []).includes('lucky')) {
    // 幸运词条：提高本只虫的稀有词条出现概率
    const r2 = mulberry32(seed ^ 0x9e37);
    const extra = rollTraits(r2, 1, 1.6)[0];
    if (extra && !g.traits.includes(extra)) g.traits.push(extra);
  }
  return applyTraitEffects(g);
}

// 手动词条集：null = 跟随种子随机；Set = 用户自选
let manualTraits = null;

// ---- 面板：词条列表 ----
function renderTraits(g) {
  const box = document.getElementById('traits');
  const list = (g.traits || []).slice()
    .sort((a, b) => RARITY[TRAITS[b].rarity].w - RARITY[TRAITS[a].rarity].w);
  box.innerHTML = list.length
    ? list.map(id => {
        const t = TRAITS[id];
        return `<div class="trait r-${t.rarity}">
          <div><div class="tn">${t.name}</div><div class="rk">${RARITY[t.rarity].label}</div></div>
          <div class="td">${t.desc}</div>
        </div>`;
      }).join('')
    : '<div class="trait r-common"><div><div class="tn">无词条</div>' +
      '<div class="rk">—</div></div><div class="td">进化后有机会觉醒</div></div>';
}

// ---- 面板：属性数值（基准 100%，叠加词条修正）----
const BASE = { eatSpeed: 2.5, affinity: 8, flySpeed: 420, fleeRadius: 96, idleTime: 12 };
const UNIT = { eatSpeed: '×', affinity: '', flySpeed: ' px/s', fleeRadius: ' px', idleTime: ' s' };
const LABEL = { eatSpeed: '进食速度', affinity: '亲密度/次', flySpeed: '飞行速度',
                fleeRadius: '警戒半径', idleTime: '停留时长' };
function renderStats(g) {
  const m = g.mods || {};
  const rows = Object.keys(BASE).map(k => {
    const v = BASE[k] * (1 + (m[k] || 0));
    const d = m[k] || 0;
    let txt;
    if (k === 'eatSpeed') txt = v.toFixed(2) + '×';
    else if (k === 'affinity') txt = '+' + v.toFixed(1);
    else if (k === 'flySpeed') txt = Math.round(v) + ' px/s';
    else if (k === 'fleeRadius') txt = Math.round(v) + ' px';
    else txt = v.toFixed(1) + ' s';
    const cls = d > 0.001 ? 'up' : (d < -0.001 ? 'dn' : '');
    return `<div class="k">${LABEL[k]}</div><div class="v ${cls}">${txt}</div>`;
  }).join('');
  document.getElementById('stats').innerHTML = rows;
}

function render(now) {
  const time = (now - t0) / 1000;
  ctx.clearRect(0, 0, W, H);
  const g = currentGenome();
  if (g.stage <= 1) drawEgg(ctx, g, time, W);
  else drawInsect(ctx, g, time, W, g.stage >= 3 && playing);
  if (playing) requestAnimationFrame(render);
}

// 缩略图网格：同物种不同种子 → 多样性
const grid = document.getElementById('grid');
function renderGrid() {
  grid.innerHTML = '';
  const seeds = [seed];
  const r = mulberry32(seed ^ 0x5f3a);
  for (let i = 0; i < 11; i++) seeds.push(Math.floor(r() * 1e6));
  seeds.forEach((s, i) => {
    const c = document.createElement('canvas');
    c.width = 108 * DPR; c.height = 108 * DPR;
    c.style.width = '108px'; c.style.height = '108px';
    const cc = c.getContext('2d');
    cc.scale(DPR, DPR);
    const g = applyTraitEffects(evolve(makeGenome(s, species, stage), stage));
    if (g.stage <= 1) drawEgg(cc, g, i * .7, 108);
    else drawInsect(cc, g, i * .7, 108, false);
    const d = document.createElement('div');
    d.className = 'cell';
    d.appendChild(c);
    const b = document.createElement('b');
    const tn = (g.traits || []).length;
    const best = (g.traits || []).reduce((m, id) =>
      RARITY[TRAITS[id].rarity].w < RARITY[TRAITS[m].rarity].w ? id : m, 'sluggish');
    b.textContent = '#' + s + (tn ? ' · ' + tn + '词条' : '');
    if (tn) b.className = 'has';
    d.title = tn ? (g.traits || []).map(id => TRAITS[id].name).join(' / ') : '无词条';
    d.style.borderLeft = tn ? '3px solid ' + ({ common: '#7d8794', rare: '#3d7fd8', epic: '#9a5fd8', legendary: '#e8a33d' })[TRAITS[best].rarity] : '';
    d.appendChild(b);
    d.onclick = () => { seed = s; restart(); };
    grid.appendChild(d);
  });
}

// ---- 词条选择器（按 外观 / 属性 分组）----
function toggleTrait(id) {
  if (!manualTraits) manualTraits = new Set(currentGenome().traits || []);
  else manualTraits = new Set(manualTraits);
  manualTraits.has(id) ? manualTraits.delete(id) : manualTraits.add(id);
  restart();
}

function renderTraitPicker() {
  const active = new Set(currentGenome().traits || []);
  const chip = id => {
    const t = TRAITS[id];
    return `<span class="tp r-${t.rarity} ${active.has(id) ? 'on' : ''}" data-id="${id}" title="${t.desc}">${t.name}</span>`;
  };
  const groups = { look: 'tpickLook', stat: 'tpickStat' };
  for (const kind in groups) {
    const box = document.getElementById(groups[kind]);
    box.innerHTML = Object.keys(TRAITS).filter(id => TRAITS[id].kind === kind).map(chip).join('');
    box.querySelectorAll('.tp').forEach(el => { el.onclick = () => toggleTrait(el.dataset.id); });
  }
}

// 预设一键搭配
const PRESETS = {
  legend: () => new Set(Object.keys(TRAITS).filter(id => TRAITS[id].rarity === 'legendary')),
  look:   () => new Set(Object.keys(TRAITS).filter(id => TRAITS[id].kind === 'look')),
  stat:   () => new Set(Object.keys(TRAITS).filter(id => TRAITS[id].kind === 'stat')),
  roll:   () => new Set(rollTraits(Math.random, 3, 1.2)),
  none:   () => new Set()
};
document.querySelectorAll('.pre').forEach(el => {
  el.onclick = () => { manualTraits = PRESETS[el.dataset.p](); restart(); };
});

document.getElementById('tclean').onclick = () => { manualTraits = null; restart(); };

function restart() {
  renderGrid();
  const g = currentGenome();
  renderTraits(g);
  renderStats(g);
  renderTraitPicker();
  if (playing) requestAnimationFrame(render);
}

document.getElementById('species').onchange = (e) => { species = e.target.value; restart(); };
document.querySelectorAll('#stages .chip').forEach(el => {
  el.onclick = () => {
    document.querySelectorAll('#stages .chip').forEach(x => x.classList.remove('on'));
    el.classList.add('on');
    stage = +el.dataset.s;
    restart();
  };
});
document.getElementById('rand').onclick = () => {
  seed = Math.floor(Math.random() * 1e6); restart();
};
document.getElementById('anim').onclick = () => {
  playing = !playing;
  if (playing) requestAnimationFrame(render);
};

// 形态微调滑块（覆盖 genome 单参数）
function bindSlider(id, apply) {
  document.getElementById(id).oninput = (e) => {
    window.__ov = window.__ov || {};
    apply(window.__ov, +e.target.value / 100);
    restart();
  };
}
const origGenome = makeGenome;
makeGenome = function (s, sp, st) {
  const g = origGenome(s, sp, st);
  if (window.__ov) {
    if (window.__ov.wingLen) g.wingLen *= window.__ov.wingLen;
    if (window.__ov.bodyW) g.bodyW *= window.__ov.bodyW;
    if (window.__ov.hue !== undefined) g.hue = window.__ov.hue;
  }
  return g;
};
bindSlider('wingLen', (o, v) => o.wingLen = v);
bindSlider('bodyW', (o, v) => o.bodyW = v);
bindSlider('hue', (o, v) => { o.hue = +document.getElementById('hue').value; });

restart();
</script>
</body>
</html>
